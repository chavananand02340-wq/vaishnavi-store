name: Check Cloudflare site

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"   # every day 08:47 IST

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live checks
        run: node tools/smoke.mjs
        env:
          SITE: https://vaishnavistores.shop
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
