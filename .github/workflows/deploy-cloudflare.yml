name: Deploy to Cloudflare

# Deploys the website to Cloudflare Workers on every push to main.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
# Other keys (Razorpay, Resend, NOTIFY_SECRET) live in the Cloudflare dashboard
# (Worker → Settings → Variables and Secrets) and are kept on every deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::Cloudflare secrets not set yet, skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.check.outputs.ok == 'true'
      - name: Build
        if: steps.check.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://vaishnavistores.shop
      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: npx opennextjs-cloudflare deploy -- --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Copy runtime keys from GitHub secrets to Cloudflare (only those that are set)
        if: steps.check.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          S_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          S_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          S_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          S_RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          S_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          S_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          S_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const out = { NEXT_PUBLIC_SITE_URL: "https://vaishnavistores.shop" };
            for (const [k, v] of Object.entries(process.env)) if (k.startsWith("S_") && v && v.trim()) out[k.slice(2)] = v.trim();
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("Setting:", Object.keys(out).join(", "));
          '
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
