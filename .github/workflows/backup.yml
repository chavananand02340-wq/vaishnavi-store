name: Nightly database backup

# Encrypted nightly backup of the Supabase database.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     – Supabase → Connect → "Session pooler" connection string (with password)
#   BACKUP_PASSPHRASE   – a long random passphrase; keep a copy somewhere safe (not in this repo)
# Backups are kept as workflow artifacts for 30 days. They are encrypted, so
# they are unreadable without the passphrase even if someone downloads them.
# Restore: gpg -d backup.sql.gz.gpg | gunzip | psql "<db url>"

on:
  schedule:
    - cron: "40 20 * * *" # 02:10 IST every night
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "Backup secrets not set yet — skipping."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.check.outputs.run == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: steps.check.outputs.run == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --no-privileges \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 \
                  -o "vaishnavi-$(date -u +%Y%m%d).sql.gz.gpg"
          ls -lh *.gpg

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.run == 'true'
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.sql.gz.gpg"
          retention-days: 30
          if-no-files-found: error
