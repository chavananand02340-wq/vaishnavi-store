name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests (delivery fee rules)
        run: npm test
      - name: Build (includes type check)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            # Surface the error as an annotation so it is visible without the raw log.
            msg=$(grep -v '^\s*$' build.log | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            if npx tsc --noEmit --pretty false > tsc.log 2>&1; then :; else
              tmsg=$(head -n 60 tsc.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=Type errors::$tmsg"
            fi
            exit 1
          fi
        env:
          # Placeholder values so the build can run; no real project is contacted.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stubs.sql
          # Run every setup part twice: proves each part is safe to re-run.
          for pass in 1 2; do
            for f in supabase/setup/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/checkout_test.sql
